<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Demo My Notes - Samsung Style</title>
<style>
:root{--bg:#1d1e22;--screen:#f6f7fb;--primary:#246BFD;--primary-soft:#EAF1FF;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--danger:#e53935;--accent:#ff9800;font-family:Inter,Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#393b43 0,#1d1e22 50%,#131417 100%);padding:22px;color:var(--text)}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}.caption{color:#d8dbe4;font-size:14px;text-align:center}.phone{position:relative;width:min(390px,100%);height:840px;background:linear-gradient(145deg,#0d0f13,#262a33);border-radius:42px;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.phone:before{content:"";position:absolute;inset:0;border-radius:42px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none}.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--screen);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.camera{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#121316;box-shadow:inset 0 0 0 2px #242730,inset 0 0 0 4px #0c0d10;z-index:5}.status{height:42px;padding:10px 18px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:#111827}.icons{display:flex;gap:8px;align-items:center}.dot,.bar,.battery{display:inline-block}.dot{width:8px;height:8px;border-radius:50%;background:#111827;opacity:.8}.bar{width:13px;height:10px;border:2px solid #111827;border-top-width:4px;border-radius:2px;opacity:.8}.battery{width:22px;height:11px;border:2px solid #111827;border-radius:3px;position:relative;opacity:.8}.battery:after{content:"";position:absolute;right:-4px;top:2px;width:3px;height:5px;background:#111827;border-radius:0 2px 2px 0}.battery:before{content:"";position:absolute;left:2px;top:2px;width:13px;height:3px;background:#111827;border-radius:2px}
.app{padding:12px 18px 18px;height:calc(100% - 42px);display:flex;flex-direction:column}.header{padding:8px 0 12px}.header h1{margin:0;font-size:29px;line-height:1.1;font-weight:800;letter-spacing:-.5px}.header p{margin:6px 0 0;color:var(--muted);font-size:13px}.searchWrap{background:#fff;border:1px solid var(--line);border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(21,25,34,.05)}.searchIcon{font-size:18px;color:#94a3b8}.search,input,textarea{width:100%;border:0;outline:0;background:transparent;padding:15px 0;font-size:15px;color:var(--text)}
.list{flex:1;margin-top:14px;overflow:auto;padding-right:2px}.card{background:#fff;border:1px solid #edf0f5;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 22px rgba(18,21,28,.05);cursor:pointer}.row{display:flex;align-items:flex-start;gap:8px}.card h3{margin:0;flex:1;font-size:18px;line-height:1.3}.star{color:var(--accent);font-size:20px;line-height:1}.card p{margin:7px 0 10px;color:#4b5563;font-size:14px;line-height:1.45}.date{font-size:12px;color:#8a94a6}.fab{position:absolute;right:24px;bottom:58px;width:58px;height:58px;border:0;border-radius:50%;background:linear-gradient(180deg,#2f7cff,#246BFD);color:#fff;font-size:32px;line-height:1;box-shadow:0 18px 26px rgba(36,107,253,.32);cursor:pointer}
.label{font-weight:700;margin:12px 0 8px;font-size:14px}.field,.contentbox{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:#fff;font-size:15px}.contentbox{min-height:190px;resize:vertical;font-family:inherit}.meta{color:var(--muted);font-size:13px;margin-top:8px}.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}.check input{width:18px;height:18px}.btnbar{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border:0;border-radius:18px;padding:14px 16px;font-size:14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.btn.secondary{background:#e9eef7;color:#334155}.btn.danger{background:#ffebee;color:var(--danger)}
.backBtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}.topRow{display:flex;align-items:center;gap:12px;margin-bottom:8px}.sectionTitle{font-size:22px;font-weight:800;margin:0}.badge{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-top:10px}.detailTitle{font-size:26px;font-weight:800;line-height:1.2;margin:10px 0 8px}.detailContent{font-size:16px;line-height:1.7;background:#fff;border:1px solid var(--line);padding:16px;border-radius:20px;margin:14px 0}.empty{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px;background:#fff;border:1px dashed #d9dfe8;border-radius:22px}.navbar{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;pointer-events:none}.navpill{width:140px;height:5px;border-radius:999px;background:#0f172a;opacity:.85}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;font-size:14px;box-shadow:0 10px 25px rgba(15,23,42,.3)}.toast.show{opacity:1}.note{font-size:12px;color:#8a94a6;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen"><div class="camera"></div><div class="status"><span>16:16</span><div class="icons"><span>5G</span><span class="dot"></span><span class="bar"></span><span class="battery"></span></div></div><div id="app" class="app"></div><div class="navbar"><div class="navpill"></div></div></div></div><div class="caption">Demo giao diện mô phỏng điện thoại Samsung / One UI — Ngô Hồng Bảo • MSSV 2311553403</div></div><div id="toast" class="toast"></div>
<script>
const seed=[{id:1,title:'Nộp báo cáo Android',content:'Hoàn thành báo cáo Android trước thứ 6.',created:'18/08/2026',updated:'18/08/2026',important:1},{id:2,title:'Học Android',content:'Ôn Activity, Intent và SQLite.',created:'18/08/2026',updated:'18/08/2026',important:0},{id:3,title:'Đi mua đồ',content:'Mua sữa, nước và đồ ăn.',created:'18/08/2026',updated:'18/08/2026',important:0}];
let notes=JSON.parse(localStorage.getItem('notes-demo-samsung-v1')||'null')||seed;const save=()=>localStorage.setItem('notes-demo-samsung-v1',JSON.stringify(notes));const app=document.getElementById('app');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){return new Date().toLocaleDateString('vi-VN')}
function shell(title,subtitle,content){app.innerHTML=`<div class="header"><h1>${title}</h1><p>${subtitle||''}</p></div>${content}`}
function showMain(q=''){shell('Ghi chú','Quản lý ghi chú cá nhân theo phong cách One UI',`<div class="searchWrap"><span class="searchIcon">🔍</span><input id="search" class="search" placeholder="Tìm kiếm ghi chú..." value="${esc(q)}"></div><div id="list" class="list"></div><button class="fab" id="add" title="Thêm ghi chú">+</button><div class="note">Demo mô phỏng luồng project Java/XML/SQLite</div>`);document.getElementById('search').oninput=e=>renderList(e.target.value);document.getElementById('add').onclick=showAdd;renderList(q)}
function renderList(q){const k=q.trim().toLowerCase();const data=notes.filter(n=>!k||n.title.toLowerCase().includes(k)||n.content.toLowerCase().includes(k));const list=document.getElementById('list');list.innerHTML=data.length?data.map(n=>`<div class="card" data-id="${n.id}"><div class="row"><h3>${esc(n.title)}</h3>${n.important?'<span class="star">★</span>':''}</div><p>${esc(n.content)}</p><div class="date">Cập nhật: ${esc(n.updated||n.created)}</div></div>`).join(''):`<div class="empty">${k?'Không tìm thấy ghi chú phù hợp.':'Chưa có ghi chú nào.<br>Hãy nhấn nút + để thêm ghi chú đầu tiên!'}</div>`;list.querySelectorAll('.card').forEach(el=>el.onclick=()=>showDetail(Number(el.dataset.id)))}
function showAdd(){shell('Thêm mới','Nhập nội dung cho ghi chú của bạn',`<div class="topRow"><button class="backBtn" id="cancel">←</button><h2 class="sectionTitle">Tạo ghi chú</h2></div><div class="label">Tiêu đề</div><input id="title" class="field" placeholder="Ví dụ: Việc cần làm hôm nay"><div class="label">Nội dung</div><textarea id="content" class="contentbox" placeholder="Nhập nội dung ghi chú..."></textarea><div class="meta">Ngày tạo sẽ được lấy tự động.</div><label class="check"><input type="checkbox" id="important"> Đánh dấu là ghi chú quan trọng</label><div class="btnbar"><button class="btn secondary" id="cancel2">HỦY</button><button class="btn primary" id="save">LƯU</button></div>`);document.getElementById('cancel').onclick=()=>showMain();document.getElementById('cancel2').onclick=()=>showMain();document.getElementById('save').onclick=()=>{const t=document.getElementById('title').value.trim();const c=document.getElementById('content').value.trim();if(!t||!c){toast('Vui lòng nhập đầy đủ tiêu đề và nội dung');return}const id=Math.max(0,...notes.map(n=>n.id))+1;notes.push({id,title:t,content:c,created:today(),updated:today(),important:document.getElementById('important').checked?1:0});save();toast('Thêm ghi chú thành công');setTimeout(()=>showMain(),350)}}
function showDetail(id){const n=notes.find(x=>x.id===id);if(!n){toast('Không tìm thấy ghi chú');return showMain()}shell('Chi tiết','Xem nội dung ghi chú',`<div class="topRow"><button class="backBtn" id="back">←</button><h2 class="sectionTitle">Ghi chú</h2></div><div class="detailTitle">${esc(n.title)}</div><div class="badge">${n.important?'★ Quan trọng':'• Bình thường'}</div><div class="detailContent">${esc(n.content)}</div><div class="meta">Ngày tạo: ${esc(n.created)}</div><div class="meta">Ngày cập nhật: ${esc(n.updated)}</div><div class="btnbar"><button class="btn primary" id="edit">SỬA</button><button class="btn danger" id="del">XÓA</button></div>`);document.getElementById('back').onclick=()=>showMain();document.getElementById('edit').onclick=()=>showEdit(id);document.getElementById('del').onclick=()=>{if(confirm('Bạn có chắc chắn muốn xóa ghi chú này?')){notes=notes.filter(x=>x.id!==id);save();toast('Đã xóa ghi chú');setTimeout(()=>showMain(),350)}}}
function showEdit(id){const n=notes.find(x=>x.id===id);shell('Chỉnh sửa','Cập nhật lại nội dung ghi chú',`<div class="topRow"><button class="backBtn" id="cancel">←</button><h2 class="sectionTitle">Sửa ghi chú</h2></div><div class="label">Tiêu đề</div><input id="title" class="field" value="${esc(n.title)}"><div class="label">Nội dung</div><textarea id="content" class="contentbox">${esc(n.content)}</textarea><label class="check"><input type="checkbox" id="important" ${n.important?'checked':''}> Đánh dấu là ghi chú quan trọng</label><div class="btnbar"><button class="btn secondary" id="cancel2">HỦY</button><button class="btn primary" id="save">LƯU</button></div>`);document.getElementById('cancel').onclick=()=>showDetail(id);document.getElementById('cancel2').onclick=()=>showDetail(id);document.getElementById('save').onclick=()=>{const t=document.getElementById('title').value.trim();const c=document.getElementById('content').value.trim();if(!t||!c){toast('Vui lòng nhập đầy đủ tiêu đề và nội dung');return}n.title=t;n.content=c;n.updated=today();n.important=document.getElementById('important').checked?1:0;save();toast('Cập nhật ghi chú thành công');setTimeout(()=>showDetail(id),350)}}
showMain();
</script>
</body>
</html>
